<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill Calculator</title>
    <!-- Memanggil font eksternal -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- APLIKASI INPUT -->
    <div id="app-container">
        <div class="header-card anim-pop">
            <h2>💸 Setup Bill</h2>
            <input type="number" id="global-ongkir" placeholder="Total Ongkir / Pajak Struk (Opsional)">
        </div>

        <div id="people-list">
            <!-- Data orang akan dirender di sini oleh JavaScript -->
        </div>

        <button class="btn-tambah anim-pop" onclick="tambahOrang()">+ Tambah Orang Temenmu</button>
        <button class="btn-hitung anim-pop" onclick="kalkulasiBill()">Hitung & Cetak Bill 🧾</button>
    </div>

    <!-- HASIL KERTAS STRUK -->
    <div id="receipt-container">
        <div class="kertas-bill" id="kertas-isi">
            <!-- Hasil cetak struk dirender di sini -->
        </div>
        <button class="btn-hitung" style="margin-top: 40px;" onclick="location.reload()">Hitung Ulang 🔄</button>
    </div>

    <!-- Menghubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
