<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill Calculator</title>
    <!-- font eksternal -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- APLIKASI INPUT -->
    <div id="app-container">
        
        <div class="horizontal-container" id="main-layout">
            
            <!-- Kolom Kiri: Setup Utama -->
            <div class="left-panel anim-pop">
                <div class="header-card">
                    <h2>💸 Setup Bill</h2>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 8px; color: #a0aec0;">Total Pajak/Ongkir Keseluruhan</label>
                    <input type="number" id="global-ongkir" placeholder="Rp (Opsional)">
                    
                    <button class="btn-tambah" onclick="tambahOrang()" style="margin-top: 15px;">+ Tambah Orang</button>
                    <button class="btn-hitung" onclick="kalkulasiBill()">Hitung & Cetak Bill 🧾</button>
                </div>
            </div>

            <!-- Kolom Kanan: Daftar Orang yang Berjejer Horizontal -->
            <div class="right-panel" id="people-list">
                <!-- Data orang akan dirender di sini oleh JavaScript -->
            </div>
            
        </div>

    </div>

    <!-- HASIL KERTAS STRUK (Berada di tengah) -->
    <div id="receipt-container">
        <div class="kertas-bill" id="kertas-isi">
            <!-- Hasil cetak struk dirender di sini -->
        </div>
        <button class="btn-hitung" style="margin-top: 40px; max-width: 400px; margin-left: auto; margin-right: auto; display: block;" onclick="location.reload()">Hitung Ulang 🔄</button>
    </div>

    <!-- Menghubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
