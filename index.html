<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill Calculator</title>
    <!-- font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .kalkulator-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00f2fe;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }
        #hasil {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="kalkulator-card">
        <h2>Calculate The Amount to Be Paid.</h2>
        <input type="number" id="hargaMakanan" placeholder="Total Harga Pembelian (Rp)">
        <input type="number" id="ongkirPajak" placeholder="Total Ongkir / Pajak (Rp) ">
        <input type="number" id="jumlahOrang" placeholder="Berapa Orang Yang Memesan?">
        
        <button onclick="hitungPatungan()">Hitung Sekarang</button>
        
        <div id="hasil">Rp 0 / orang</div>
    </div>

    <script>
        function hitungPatungan() {
            // 1. Mengambil angka dari input HTML
            let harga = Number(document.getElementById("hargaMakanan").value);
            let ongkir = Number(document.getElementById("ongkirPajak").value);
            let orang = Number(document.getElementById("jumlahOrang").value);

            // 2. Validasi sederhana agar tidak dibagi 0
            if (orang === 0) {
                alert("Jumlah orang tidak boleh kosong!");
                return;
            }

            // 3. Logika Matematika
            let totalBayar = harga + ongkir;
            let bayarPerOrang = totalBayar / orang;

            // 4. Menampilkan hasil ke layar
            let elemenHasil = document.getElementById("hasil");
            elemenHasil.innerHTML = "Masing-masing bayar: <br> Rp " + bayarPerOrang.toLocaleString('id-ID');
            elemenHasil.style.opacity = 1; // Memunculkan teks dengan halus
        }
    </script>

</body>
</html>
